[package]
name = "kb-onemail"
version = "0.3.0"
edition = "2021"
rust-version = "1.95"
description = "KB OneMail Windows mail client"
license = "MIT"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
url = "2"
time = { version = "0.3", features = ["parsing"] }
cookie = "0.18"
rfd = "0.16"
open = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["UI_Notifications", "Data_Xml_Dom", "Networking_Connectivity", "Win32_System_Power", "Win32_Graphics_Dwm", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_FileSystem"] }
windows-registry = "0.6"
webview2-com = "0.39"

[dev-dependencies]
minisign-verify = "0.3"
