name: KB OneMail Windows preview
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the versioned preview and update channel
        type: boolean
        default: false
      backend_verified:
        description: Compatible hosted backend and installer acceptance have passed
        type: boolean
        default: false
  push:
    tags: ["desktop-v*"]
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 45
    outputs:
      release_tag: ${{ steps.metadata.outputs.release_tag }}
    defaults:
      run:
        shell: pwsh
        working-directory: desktop
    env:
      CARGO_BUILD_JOBS: "2"
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      KB_ONEMAIL_UPDATER_PUBLIC_KEY: ${{ vars.KB_ONEMAIL_UPDATER_PUBLIC_KEY }}
      KB_ONEMAIL_UPDATER_ENDPOINT: ${{ vars.KB_ONEMAIL_UPDATER_ENDPOINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Select pinned Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
      - name: Check release identity and signing credentials
        id: metadata
        run: |
          if (!$env:TAURI_SIGNING_PRIVATE_KEY -or !$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) { throw 'Updater signing credentials are required' }
          $version = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid desktop version' }
          $releaseTag = "desktop-v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $releaseTag) { throw 'Tag/config version mismatch' }
          "release_tag=$releaseTag" >> $env:GITHUB_OUTPUT
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Build unsigned publisher installer with signed updater artifacts
        run: bun run build
      - name: Prepare immutable release metadata
        env:
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath src-tauri/target/release/bundle/nsis -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one NSIS installer' }
          cargo run --manifest-path src-tauri/Cargo.toml --example verify-installer --locked -j 2 -- $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installer signature verification failed' }
          bun ../scripts/desktop-release.ts $installers[0].FullName $env:RELEASE_TAG $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata validation failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kb-onemail-windows-x64-unsigned
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sha256
            desktop/src-tauri/target/release/bundle/nsis/latest.json
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.backend_verified
    needs: package
    runs-on: windows-2022
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.package.outputs.release_tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Retrieve verified build artifacts
        run: gh run download $env:GITHUB_RUN_ID --repo $env:GH_REPO --name kb-onemail-windows-x64-unsigned --dir assets
      - name: Publish versioned installer before the update channel
        run: |
          $ErrorActionPreference = 'Stop'
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -eq 0) { throw 'Versioned releases are immutable; bump the desktop version' }
          $manifest = Get-Content -Raw assets/latest.json | ConvertFrom-Json
          $notes = "$($manifest.notes)`n`nRequires internet and WebView2. Installer is unsigned; Windows may show a publisher warning."
          [IO.File]::WriteAllText((Join-Path $PWD 'release-notes.txt'), $notes)
          gh release create $env:RELEASE_TAG --repo $env:GH_REPO --target $env:GITHUB_SHA --draft --prerelease --title "KB OneMail $($manifest.version) - Windows personal preview" --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Could not create versioned draft release' }
          $files = @(Get-ChildItem -LiteralPath assets -File | Where-Object { $_.Name -ne 'latest.json' } | ForEach-Object FullName)
          gh release upload $env:RELEASE_TAG --repo $env:GH_REPO @files
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload immutable installer assets' }
          gh release edit $env:RELEASE_TAG --repo $env:GH_REPO --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish versioned installer' }
          gh release view desktop-preview --repo $env:GH_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create desktop-preview --repo $env:GH_REPO --target $env:GITHUB_SHA --prerelease --title 'KB OneMail preview update channel' --notes 'Channel metadata only. Installers live in immutable versioned releases.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create update channel' }
          }
          gh release upload desktop-preview assets/latest.json --repo $env:GH_REPO --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish channel manifest' }
