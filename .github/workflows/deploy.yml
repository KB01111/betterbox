name: Deploy private KB OneMail
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: betterbox-production
  cancel-in-progress: false
jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: bun run test:runtime
      - name: Record D1 recovery bookmark before migrations
        run: bunx wrangler d1 time-travel info DB --json
      - run: bun run db:migrate:remote
      - run: bunx wrangler deploy
