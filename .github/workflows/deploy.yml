name: Deploy private BetterBox
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: betterbox-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build
      - run: bun run test:runtime
      - name: Record D1 recovery bookmark before migrations
        run: bunx wrangler d1 time-travel info DB --json
      - run: bun run db:migrate:remote
      - run: bunx wrangler deploy
